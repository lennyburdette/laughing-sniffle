<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1e3a5f" opacity="0.3"/>

  <!-- Figure on hands and knees - showing cat pose (arched back) -->
  <!-- Head (looking down in cat pose) -->
  <circle cx="55" cy="95" r="14" fill="#64b5f6"/>

  <!-- Spine/Back - arched up (cat pose) -->
  <path d="M65 90 Q100 60 140 90" stroke="#4caf50" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- Left arm -->
  <path d="M70 88 L55 130" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
  <circle cx="55" cy="133" r="6" fill="#ffb74d"/>

  <!-- Right arm -->
  <path d="M130 88 L145 130" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
  <circle cx="145" cy="133" r="6" fill="#ffb74d"/>

  <!-- Left leg (kneeling) -->
  <path d="M85 95 L70 130" stroke="#2196f3" stroke-width="12" stroke-linecap="round"/>
  <path d="M70 130 L75 150" stroke="#2196f3" stroke-width="10" stroke-linecap="round"/>

  <!-- Right leg (kneeling) -->
  <path d="M125 95 L140 130" stroke="#2196f3" stroke-width="12" stroke-linecap="round"/>
  <path d="M140 130 L145 150" stroke="#2196f3" stroke-width="10" stroke-linecap="round"/>

  <!-- Movement arrows showing up/down spine motion -->
  <path d="M100 55 L100 40" stroke="#ff9800" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 40 L95 48 L105 48" fill="#ff9800"/>

  <path d="M100 115 L100 130" stroke="#ff9800" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M100 130 L95 122 L105 122" fill="#ff9800" opacity="0.6"/>

  <!-- "Cat" and "Cow" indicators -->
  <text x="100" cy="28" text-anchor="middle" font-size="10" fill="#81c784" font-family="Arial, sans-serif">CAT</text>
  <text x="100" y="145" text-anchor="middle" font-size="10" fill="#81c784" opacity="0.6" font-family="Arial, sans-serif">COW</text>

  <!-- Ground/Mat line -->
  <path d="M30 160 L170 160" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
