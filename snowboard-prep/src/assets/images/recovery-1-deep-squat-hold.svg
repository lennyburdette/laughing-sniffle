<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1e3a5f" opacity="0.3"/>

  <!-- Figure in deep squat position -->
  <!-- Head -->
  <circle cx="100" cy="55" r="15" fill="#64b5f6"/>

  <!-- Torso (slightly forward lean) -->
  <path d="M100 70 L100 110" stroke="#4caf50" stroke-width="18" stroke-linecap="round"/>

  <!-- Arms forward for balance -->
  <path d="M95 85 L65 80" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
  <path d="M105 85 L135 80" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>

  <!-- Thighs (bent deeply, horizontal) -->
  <path d="M95 115 L65 130" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>
  <path d="M105 115 L135 130" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>

  <!-- Lower legs (vertical, feet flat) -->
  <path d="M65 130 L60 165" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>
  <path d="M135 130 L140 165" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>

  <!-- Feet flat on ground -->
  <ellipse cx="55" cy="170" rx="12" ry="6" fill="#2196f3"/>
  <ellipse cx="145" cy="170" rx="12" ry="6" fill="#2196f3"/>

  <!-- Relaxation/hold indicator - gentle waves -->
  <path d="M75 145 Q80 140 85 145 Q90 150 95 145" stroke="#ff9800" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M105 145 Q110 140 115 145 Q120 150 125 145" stroke="#ff9800" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Ground line -->
  <path d="M20 178 L180 178" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
