<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Background circle -->
  <rect width="192" height="192" rx="24" fill="#1a1a2e"/>

  <!-- Snowboard icon -->
  <g transform="translate(96, 96)">
    <!-- Snowboard body - tilted -->
    <ellipse cx="0" cy="0" rx="60" ry="14" transform="rotate(-30)" fill="#4caf50"/>
    <ellipse cx="0" cy="-2" rx="55" ry="10" transform="rotate(-30)" fill="#66bb6a"/>

    <!-- Binding details -->
    <rect x="-25" y="-8" width="12" height="16" rx="2" transform="rotate(-30)" fill="#2196f3"/>
    <rect x="13" y="-8" width="12" height="16" rx="2" transform="rotate(-30)" fill="#2196f3"/>

    <!-- Snow/mountain accent -->
    <path d="M-40 30 L0 0 L40 30 L20 30 L0 15 L-20 30 Z" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Snowflake accents -->
  <circle cx="40" cy="40" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="50" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="45" cy="145" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="155" cy="140" r="4" fill="#ffffff" opacity="0.6"/>

  <!-- Timer ring accent -->
  <circle cx="96" cy="96" r="75" fill="none" stroke="#ff9800" stroke-width="4" stroke-dasharray="30 15" opacity="0.4"/>
</svg>
