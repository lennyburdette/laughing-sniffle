<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1e3a5f" opacity="0.3"/>

  <!-- Figure lying on back with spinal twist -->
  <!-- Head (turned to the left) -->
  <circle cx="35" cy="85" r="15" fill="#64b5f6"/>

  <!-- Torso (lying flat on back) -->
  <path d="M50 90 L110 100" stroke="#4caf50" stroke-width="18" stroke-linecap="round"/>

  <!-- Arms extended out (T-position) -->
  <path d="M55 95 L25 115" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
  <path d="M100 100 L130 80" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>

  <!-- Shoulders flat indicator -->
  <ellipse cx="70" cy="95" rx="8" ry="5" fill="#4caf50" opacity="0.5"/>

  <!-- Hip (twisted) -->
  <ellipse cx="115" cy="105" rx="12" ry="10" fill="#4caf50" opacity="0.5"/>

  <!-- Bent knee crossing over body (the twist) -->
  <path d="M115 105 L85 140" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>

  <!-- Lower leg of crossed leg -->
  <path d="M85 140 L70 165" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>

  <!-- Straight leg on ground -->
  <path d="M115 110 L160 130" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>
  <path d="M160 130 L180 140" stroke="#2196f3" stroke-width="12" stroke-linecap="round"/>

  <!-- Rotation/twist arrow -->
  <path d="M100 125 Q80 135 75 150" stroke="#ff9800" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M82 148 L75 150 L78 142" stroke="#ff9800" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Look opposite direction indicator -->
  <path d="M35 75 Q30 65 25 70" stroke="#ff9800" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Ground line -->
  <path d="M20 178 L180 178" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
