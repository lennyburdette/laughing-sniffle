<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1e3a5f" opacity="0.3"/>

  <!-- Figure in standing hip hinge position -->
  <!-- Head -->
  <circle cx="65" cy="70" r="16" fill="#64b5f6"/>

  <!-- Torso - hinged forward at hips -->
  <path d="M70 85 L115 110" stroke="#4caf50" stroke-width="18" stroke-linecap="round"/>

  <!-- Back leg (standing leg, slightly bent) -->
  <path d="M115 110 L130 145" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>
  <path d="M130 145 L135 170" stroke="#2196f3" stroke-width="12" stroke-linecap="round"/>

  <!-- Front leg (extended forward, heel on ground) -->
  <path d="M115 110 L80 130" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>
  <path d="M80 130 L55 145" stroke="#2196f3" stroke-width="12" stroke-linecap="round"/>
  <path d="M55 145 L45 145" stroke="#2196f3" stroke-width="8" stroke-linecap="round"/>

  <!-- Arms reaching toward front foot -->
  <path d="M85 95 L55 115" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
  <circle cx="52" cy="118" r="6" fill="#ffb74d"/>

  <!-- Stretch indicator on hamstring -->
  <path d="M85 120 Q75 135 70 150" stroke="#ff9800" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="6 4"/>

  <!-- Hinge arrow at hip -->
  <path d="M125 95 Q135 90 140 100" stroke="#ff9800" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M140 100 L145 92 L143 103" fill="#ff9800"/>

  <!-- Ground line -->
  <path d="M25 175 L175 175" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
