<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#1a1a2e"/>

  <!-- Snowboard icon -->
  <g transform="translate(256, 256)">
    <!-- Snowboard body - tilted -->
    <ellipse cx="0" cy="0" rx="160" ry="38" transform="rotate(-30)" fill="#4caf50"/>
    <ellipse cx="0" cy="-5" rx="148" ry="28" transform="rotate(-30)" fill="#66bb6a"/>

    <!-- Edge detail -->
    <ellipse cx="0" cy="0" rx="160" ry="38" transform="rotate(-30)" fill="none" stroke="#388e3c" stroke-width="3"/>

    <!-- Binding details -->
    <rect x="-67" y="-22" width="32" height="44" rx="5" transform="rotate(-30)" fill="#2196f3"/>
    <rect x="-67" y="-22" width="32" height="44" rx="5" transform="rotate(-30)" fill="none" stroke="#1976d2" stroke-width="2"/>
    <rect x="35" y="-22" width="32" height="44" rx="5" transform="rotate(-30)" fill="#2196f3"/>
    <rect x="35" y="-22" width="32" height="44" rx="5" transform="rotate(-30)" fill="none" stroke="#1976d2" stroke-width="2"/>

    <!-- Binding straps -->
    <rect x="-63" y="-8" width="24" height="6" rx="2" transform="rotate(-30)" fill="#1565c0"/>
    <rect x="39" y="-8" width="24" height="6" rx="2" transform="rotate(-30)" fill="#1565c0"/>

    <!-- Snow/mountain accent -->
    <path d="M-110 80 L0 0 L110 80 L55 80 L0 40 L-55 80 Z" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Snowflake accents -->
  <circle cx="100" cy="100" r="10" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="130" r="8" fill="#ffffff" opacity="0.5"/>
  <circle cx="120" cy="380" r="8" fill="#ffffff" opacity="0.5"/>
  <circle cx="410" cy="370" r="10" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="250" r="6" fill="#ffffff" opacity="0.4"/>
  <circle cx="430" cy="260" r="6" fill="#ffffff" opacity="0.4"/>

  <!-- Timer ring accent -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ff9800" stroke-width="8" stroke-dasharray="80 40" opacity="0.35"/>
</svg>
