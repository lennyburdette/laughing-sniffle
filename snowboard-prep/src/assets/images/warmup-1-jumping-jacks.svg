<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1e3a5f" opacity="0.3"/>

  <!-- Figure doing jumping jacks - arms up, legs apart -->
  <!-- Head -->
  <circle cx="100" cy="45" r="18" fill="#64b5f6"/>

  <!-- Body/Torso -->
  <rect x="90" y="63" width="20" height="45" rx="8" fill="#4caf50"/>

  <!-- Left arm raised -->
  <path d="M90 70 L55 35" stroke="#4caf50" stroke-width="12" stroke-linecap="round"/>

  <!-- Right arm raised -->
  <path d="M110 70 L145 35" stroke="#4caf50" stroke-width="12" stroke-linecap="round"/>

  <!-- Left leg spread -->
  <path d="M92 108 L60 165" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>

  <!-- Right leg spread -->
  <path d="M108 108 L140 165" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>

  <!-- Motion lines -->
  <path d="M45 50 L35 40" stroke="#81c784" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M45 35 L35 25" stroke="#81c784" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M155 50 L165 40" stroke="#81c784" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M155 35 L165 25" stroke="#81c784" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Ground line -->
  <path d="M30 175 L170 175" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
