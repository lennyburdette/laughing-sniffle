<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1e3a5f" opacity="0.3"/>

  <!-- Figure with arms extended doing torso rotations -->
  <!-- Head -->
  <circle cx="100" cy="40" r="18" fill="#64b5f6"/>

  <!-- Shoulders/upper torso (rotated slightly) -->
  <ellipse cx="100" cy="65" rx="35" ry="12" fill="#4caf50" transform="rotate(-15 100 65)"/>

  <!-- Lower torso/core (stable) -->
  <rect x="88" y="72" width="24" height="35" rx="8" fill="#4caf50"/>

  <!-- Left arm extended (reaching back due to rotation) -->
  <path d="M75 62 L35 55" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>

  <!-- Right arm extended (reaching forward due to rotation) -->
  <path d="M125 68 L165 75" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>

  <!-- Hips (stable, shown with slight line) -->
  <ellipse cx="100" cy="107" rx="25" ry="8" fill="#2d5a87" opacity="0.8"/>

  <!-- Left leg -->
  <path d="M85 107 L75 165" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>

  <!-- Right leg -->
  <path d="M115 107 L125 165" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>

  <!-- Rotation arrow (curved) around torso -->
  <path d="M55 45 Q 100 20 145 45" stroke="#ff9800" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <path d="M145 45 L148 35 L155 48" stroke="#ff9800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Secondary rotation arrow (opposite direction indicator) -->
  <path d="M145 85 Q 100 110 55 85" stroke="#ff9800" stroke-width="3" fill="none" stroke-dasharray="6 4" opacity="0.6"/>
  <path d="M55 85 L52 95 L45 82" stroke="#ff9800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>

  <!-- Ground line -->
  <path d="M40 175 L160 175" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
