<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1e3a5f" opacity="0.3"/>

  <!-- Figure in kneeling ankle stretch position -->
  <!-- Head -->
  <circle cx="95" cy="50" r="16" fill="#64b5f6"/>

  <!-- Torso - upright -->
  <path d="M95 66 L100 110" stroke="#4caf50" stroke-width="18" stroke-linecap="round"/>

  <!-- Back leg (kneeling on ground) -->
  <path d="M100 110 L130 140" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>
  <path d="M130 140 L160 150" stroke="#2196f3" stroke-width="12" stroke-linecap="round"/>
  <!-- Knee on ground -->
  <circle cx="132" cy="142" r="8" fill="#2196f3"/>

  <!-- Front leg (foot forward, knee driving over toes) -->
  <path d="M100 110 L65 130" stroke="#2196f3" stroke-width="14" stroke-linecap="round"/>
  <path d="M65 130 L55 170" stroke="#2196f3" stroke-width="12" stroke-linecap="round"/>
  <!-- Foot on ground -->
  <path d="M55 170 L40 170" stroke="#2196f3" stroke-width="10" stroke-linecap="round"/>

  <!-- Hands on front knee for balance -->
  <path d="M100 85 L65 110" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
  <circle cx="63" cy="112" r="6" fill="#ffb74d"/>

  <!-- Knee driving forward arrow -->
  <path d="M50 125 L35 125" stroke="#ff9800" stroke-width="3" stroke-linecap="round"/>
  <path d="M35 125 L42 120 L42 130" fill="#ff9800"/>

  <!-- Ankle dorsiflexion indicator -->
  <path d="M48 155 Q40 160 38 170" stroke="#ff9800" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="5 3"/>

  <!-- Ground line -->
  <path d="M25 175 L175 175" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
